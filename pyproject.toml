[project]
name = "paperback"
version = "0.1.0"
description = "Anki 默写本：生成可打印默写卷，纸笔默写后批改评分写回 Anki"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "requests>=2.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=12.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
paperback = "paperback.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
